<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Neon · wolf-girl pop loop</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>

</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="hint"><b>Space</b> — пауза · <b>M</b> — музыка · <b>F</b> — на весь экран<br>двигай мышью — она следит · клик — сердечки</div>

</div>

<script>
/* ============================================================================
   NEON — 2D wolf-girl pop loop. Один файл, без зависимостей.
   Всё нарисовано кодом: персонаж (кости + IK ног + физика хвоста/хвостика),
   фоны, частицы, переходы, зерно, опциональная chiptune-музыка (WebAudio).
   Время детерминировано (фиксированный шаг 1/60), поэтому кадры можно
   рендерить покадрово:  NEON.advanceTo(t)
   ========================================================================== */
(() => {

const PARAMS = new URLSearchParams(location.search);
let Q = +(PARAMS.get('q') || 1.5), RW = Math.round(W * Q), RH = Math.round(H * Q);

const C = {
  ink:'#1b1522', red:'#e8254f', redD:'#b3163a', pink:'#f5a0bd', hot:'#ff6f9a', blue:'#a7e1f7', cream:'#fff6f8',
  lav:'#d4d6ec', yellow:'#ffd84a', skin:'#fff0ee', skinS:'#f3c3c8', hair:'#221825', hairS:'#150f19', hairH:'#52405e',
  dress:'#1d1925', dressS:'#2d2738', fur:'#3d2e33', furS:'#291d22', furH:'#5d474d', earIn:'#eba6b0'
};

/* ---------- math ---------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const sm = t => t * t * (3 - 2 * t);
const outCubic = t => 1 - Math.pow(1 - t, 3);
const inOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const outBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const outElastic = t => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (TAU / 3)) + 1;
const prog = (u, t0, d) => clamp((u - t0) / d);
function track(u, keys) {
  if (u <= keys[0][0]) return keys[0][1];

    const [t0, v0] = keys[i - 1], [t1, v1] = keys[i]; return lerp(v0, v1, sm((u - t0) / (t1 - t0)));

/* ---------- canvases ---------- */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const Lc = document.createElement('canvas'), Lx = Lc.getContext('2d'), Sc = document.createElement('canvas'), Sx = Sc.getContext('2d');
const DPAT = {}, HC = {};
let grainPat = null;
function setQuality(q) {
  Q = q; RW = Math.round(W * Q); RH = Math.round(H * Q);
  cv.width = Lc.width = RW; cv.height = Lc.height = RH; Sc.width = RW >> 1; Sc.height = RH >> 1;
  for (const k in DPAT) delete DPAT[k]; for (const k in HC) delete HC[k]; grainPat = null;
}

/* ---------- sprites ---------- */
const HEART = ['.XX.XX.', 'XXXXXXX', 'XXXXXXX', '.XXXXX.', '..XXX..', '...X...'];
function mkHeart(col, hi, lo) {
  const p = 8, e = document.createElement('canvas'); e.width = 9 * p; e.height = 8 * p; const g = e.getContext('2d');
  const on = (x, y) => x >= 0 && y >= 0 && y < 6 && x < 7 && HEART[y][x] === 'X';
  for (let y = -1; y <= 6; y++) for (let x = -1; x <= 7; x++)
    if (!on(x, y) && (on(x - 1, y) || on(x + 1, y) || on(x, y - 1) || on(x, y + 1))) { g.fillStyle = C.ink; g.fillRect((x + 1) * p, (y + 1) * p, p, p); }
  for (let y = 0; y < 6; y++) for (let x = 0; x < 7; x++) if (on(x, y)) {
    g.fillStyle = col;
    if ((x === 1 && y <= 1)) g.fillStyle = hi;
    if ((x === 5 && y >= 1 && y <= 2) || (x === 4 && y === 3) || (x === 3 && y === 4) || (x === 3 && y === 5)) g.fillStyle = lo;
    g.fillRect((x + 1) * p, (y + 1) * p, p, p);

}
const HEARTS = {
  red: mkHeart('#ee2d5c', '#ff8fa8', '#b8163c'), blue: mkHeart('#9be2fb', '#e6faff', '#5fb4d6'),
  yellow: mkHeart('#ffd84a', '#fff3a8', '#e0a420'), pink: mkHeart('#ff7ea8', '#ffd0e0', '#d94a7c')
};
function drawHeart(c, key, x, y, s, rot = 0, a = 1) {
  const e = HEARTS[key]; c.save(); c.globalAlpha *= a; c.translate(x, y); c.rotate(rot); c.scale(s, s);
  c.imageSmoothingEnabled = false; c.drawImage(e, -e.width / 2, -e.height / 2); c.restore();
}
function star4(c, x, y, r, rot, fill, stroke, lw, pinch = .2) {
  c.save(); c.translate(x, y); c.rotate(rot); c.beginPath();
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2, b = a + Math.PI / 4, n = a + Math.PI / 2;
    if (i === 0) c.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    c.quadraticCurveTo(Math.cos(b) * r * pinch, Math.sin(b) * r * pinch, Math.cos(n) * r, Math.sin(n) * r);
  }

  if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw; c.stroke(); }

}
function note(c, x, y, s, rot, col) {
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s); c.lineJoin = c.lineCap = 'round';
  for (let pass = 0; pass < 2; pass++) {
    const g = pass === 0 ? 7 : 0; c.strokeStyle = c.fillStyle = pass ? col : C.ink;
    c.lineWidth = 7 + g; c.beginPath(); c.moveTo(11, 8); c.lineTo(11, -42); c.quadraticCurveTo(14, -40, 25, -28); c.stroke();
    c.beginPath(); c.ellipse(0, 10, 13 + g / 2, 10 + g / 2, -.45, 0, TAU); c.fill();
  }

const noiseTiles = [0, 1, 2].map(k => {
  const e = document.createElement('canvas'); e.width = e.height = 256; const g = e.getContext('2d'), d = g.createImageData(256, 256), r = mulberry(99 + k);
  for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255 | 0; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); return e;

/* ============================================================================
   STATE / PHYSICS
   ========================================================================== */
const S = { t: 0, beat: -1, parts: [], flash: 0, shake: 0, ptr: { x: 0, y: 0, last: -99 }, ptrW: 0, lk: { x: 0, y: 0 }, rnd: mulberry(7) };
const PONY_N = 8, TAIL_N = 7;
const mkChain = n => ({ p: Array.from({ length: n }, () => ({ x: 0, y: 0, px: 0, py: 0 })), init: false });
S.pony = mkChain(PONY_N); S.tail = mkChain(TAIL_N);

// rest shapes (head-local / pelvis-local), see headPt/bodyPt
const PONY_REST = [[-50, -368], [-82, -390], [-122, -376], [-150, -340], [-166, -296], [-174, -246], [-172, -200], [-166, -160]];
const PONY_LEN = PONY_REST.slice(1).map((p, i) => Math.hypot(p[0] - PONY_REST[i][0], p[1] - PONY_REST[i][1]));
const TAIL_REST = [[-6, -34], [-62, -22], [-118, 8], [-158, 58], [-178, 116], [-174, 172], [-158, 218]];
const TAIL_LEN = TAIL_REST.slice(1).map((p, i) => Math.hypot(p[0] - TAIL_REST[i][0], p[1] - TAIL_REST[i][1]));

function bodyPt(P, x, y) { const c = Math.cos(P.lean), s = Math.sin(P.lean); return [x * c - y * s + P.bx, x * s + y * c + P.by]; }
function headPt(P, x, y) {
  const c = Math.cos(P.hr), s = Math.sin(P.hr), dx = x, dy = y + 212;
  return bodyPt(P, dx * c - dy * s + P.hx, dx * s + dy * c - 212 + P.hy);
}
function stepChain(ch, rest, len, stiff, grav, damp) {
  const p = ch.p, n = p.length;
  if (!ch.init) { for (let i = 0; i < n; i++) { p[i].x = p[i].px = rest[i][0]; p[i].y = p[i].py = rest[i][1]; } ch.init = true; return; }
  p[0].x = p[0].px = rest[0][0]; p[0].y = p[0].py = rest[0][1];
  for (let i = 1; i < n; i++) {
    const q = p[i], vx = (q.x - q.px) * damp, vy = (q.y - q.py) * damp;
    q.px = q.x; q.py = q.y; q.x += vx; q.y += vy + grav;
    const k = stiff[i]; q.x += (rest[i][0] - q.x) * k; q.y += (rest[i][1] - q.y) * k;
  }
  for (let it = 0; it < 4; it++) for (let i = 1; i < n; i++) {
    const a = p[i - 1], b = p[i]; let dx = b.x - a.x, dy = b.y - a.y; const d = Math.hypot(dx, dy) || 1e-6, e = (d - len[i - 1]) / d;
    if (i === 1) { b.x -= dx * e; b.y -= dy * e; } else { a.x += dx * e * .5; a.y += dy * e * .5; b.x -= dx * e * .5; b.y -= dy * e * .5; }
  }

/* ============================================================================
   TIMELINE / POSE
   ========================================================================== */
function sceneOf(t) { const ph = t % LOOP, sc = Math.floor(ph / SLEN) % 4; return [sc, ph - sc * SLEN]; }
const blinkF = t => { const b = (t + 1.3) % 3.4; return b < .16 ? Math.abs(b / .08 - 1) : 1; };

function getPose(sc, u, t) {
  const bt = t / BEAT, bp = bt % 1, pul = Math.exp(-bp * 6), sw = Math.sin(bt * Math.PI / 2);
  const P = {
    bx: 0, by: 0, lean: 0, sx: 1, sy: 1, hr: 0, hx: 0, hy: 0,
    aL: [-.55, .56], aR: [.15, .08], hoL: .35, hoR: .6,
    fL: -50, fR: 50, liftL: 0, liftR: 0,
    emL: 'normal', emR: 'normal', oL: 1, oR: 1, brow: 0, mouth: 'smile', blush: .75, lx: 0, ly: 0, earL: 0, earR: 0, wag: 1, pul, bt
  };
  const blink = blinkF(t);
  if (sc === 0) {                                   // ---- серая: стоит, рука на бедре, потом поднимает руку
    P.bx = sw * 7; P.by = pul * 3; P.lean = sw * .012; P.hr = .05 + Math.sin(bt * Math.PI / 2 + 1.2) * .03; P.hx = sw * 2;
    P.aR = [.14 + Math.sin(bt * Math.PI / 2 + .5) * .04, .06 + Math.sin(bt * Math.PI / 2 + .9) * .05];
    const op = track(u, [[0, 0], [.85, 0], [1.1, 1]]);
    P.oL = P.oR = op * (u > 1.3 ? blink : 1);
    P.lx = track(u, [[0, 0], [1.25, 0], [1.5, -.9], [2.1, -.9], [2.4, .8], [2.9, .8], [3.15, 0]]);
    P.ly = track(u, [[1.2, 0], [1.5, .1], [2.4, -.15], [3.1, 0]]);
    const lift = track(u, [[3.0, 0], [3.65, 1]]);
    P.aR = [lerp(P.aR[0], 2.25, lift), lerp(P.aR[1], 3.0, lift)]; P.hoR = lerp(.6, 1, lift);
    P.mouth = u > 3.15 ? 'o' : 'smile'; if (u > 3.15) { P.brow = .6; P.blush = 1; }

  } else if (sc === 1) {                            // ---- розовая: волна рукой, подмигивание

    P.aR = [2.25 + .06 * Math.sin(bt * Math.PI), 3.0 + .42 * Math.sin(bt * Math.PI * 2)]; P.hoR = 1; P.hoL = .5;
    if (u < .85) { P.emL = P.emR = 'cross'; P.mouth = 'o'; P.brow = .6; }
    else { P.emL = 'cross'; P.emR = 'happy'; P.mouth = 'open'; P.brow = .35; }
    P.blush = 1; P.lx = .0; P.wag = 1.5; P.earR = Math.sin(t * 9) * .05;
  } else if (sc === 2) {                            // ---- лучи: крупный план, «?!»
    const shk = Math.sin(t * 41) * .025 * (u < 2.3 ? 1 : .3);

    P.hr = track(u, [[0, .02], [.55, -.15], [1.7, -.15], [2.3, .12], [3.75, .1]]);
    P.hx = track(u, [[0, 0], [.55, -5], [1.7, -5], [2.3, 4], [3.75, 4]]);
    P.lx = track(u, [[0, 0], [.5, 0], [.75, -.9], [1.7, -.9], [2.1, 0]]); P.ly = track(u, [[.5, 0], [.75, -.7], [1.7, -.7], [2.1, 0]]);
    if (u < 2.25) { P.brow = 1; P.mouth = 'pout'; P.blush = 1; P.oL = P.oR = blink; P.earL = shk * 4; P.earR = -shk * 4; }
    else { P.brow = -.45; P.mouth = 'fang'; P.blush = 1; P.oL = P.oR = .62; P.earL = Math.sin(t * 8) * .03; }

function getCam(sc, u, t) {

  else if (sc === 1) { s = 1.25 + .05 * sm(k); y = 628; }
  else if (sc === 2) { s = track(u, [[0, 1.9], [2.2, 2.05], [2.4, 2.25], [3.75, 2.32]]); x = 652; y = 350 + (s - 1.9) * 12 + 310 * s; }

/* ============================================================================

function spawn(o) { S.parts.push(Object.assign({ x: 0, y: 0, vx: 0, vy: 0, g: 0, rot: 0, vr: 0, s: 1, life: 2, age: 0, kind: 'heart', key: 'red', front: false, bob: 0, ph: S.rnd() * TAU, drag: 1 }, o)); }

  if (sc === 3 && b % 2 === 0) for (let i = 0; i < 2; i++) spawn({ kind: r() < .5 ? 'note' : 'heart', x: 100 + r() * 1080, y: 760, vy: -(110 + r() * 80), s: .6 + r() * .5, key: ['red', 'yellow', 'blue'][r() * 3 | 0], life: 6, bob: 20, rot: (r() - .5) * .6 });

    spawn({ kind: 'star', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, drag: .97, s: .6 + S.rnd() * .6, life: .8 + S.rnd() * .5, vr: (S.rnd() - .5) * 8, front: true, key: ['red', 'white', 'yellow'][i % 3] }); }

/* ============================================================================

  if (!grainPat) grainPat = noiseTiles.map(e => c.createPattern(e, 'repeat'));
  c.save(); c.globalAlpha = .07; c.globalCompositeOperation = 'overlay'; c.fillStyle = grainPat[Math.floor(t * 24) % 3]; c.fillRect(0, 0, RW, RH); c.restore();
  const vg = c.createRadialGradient(RW / 2, RH / 2, RH * .55, RW / 2, RH / 2, RH * 1.05); vg.addColorStop(0, 'rgba(30,10,40,0)'); vg.addColorStop(1, 'rgba(30,10,40,.22)'); c.fillStyle = vg; c.fillRect(0, 0, RW, RH);
  // переход
  const ph = t % LOOP, db = ph - Math.round(ph / SLEN) * SLEN, hw = .3;
  if (Math.abs(db) < hw) { c.save(); c.scale(Q, Q); drawWipe(c, (db + hw) / (2 * hw)); c.restore(); }
  if (S.flash > .05) { c.fillStyle = `rgba(255,255,255,${S.flash * .35})`; c.fillRect(0, 0, RW, RH); }
}

/* ============================================================================
   AUDIO (опционально) — chiptune 128 BPM: kick / clap / hat / bass / arp
   ========================================================================== */
const Snd = {
  ctx: null, on: false, next: 0, noise: null,
  init() {
    if (this.ctx) return; const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
    this.ctx = new A(); this.master = this.ctx.createGain(); this.master.gain.value = .5; this.master.connect(this.ctx.destination);
    const n = this.ctx.sampleRate * .5, b = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = b.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1; this.noise = b;
    const re = new Float32Array([0, 0, 0, 0, 0]), im = new Float32Array([0, 1, 0, .6, 0]);   // «узкий» пульс
    this.wave = this.ctx.createPeriodicWave(new Float32Array([0, 0, 0, 0, 0, 0, 0, 0]), new Float32Array([0, 1, .5, .33, .25, .2, .16, .14]));
  },
  env(g, t0, a, d, peak) { g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(peak, t0 + a); g.gain.exponentialRampToValueAtTime(.0008, t0 + a + d); },
  kick(t0) { const o = this.ctx.createOscillator(), g = this.ctx.createGain(); o.frequency.setValueAtTime(160, t0); o.frequency.exponentialRampToValueAtTime(42, t0 + .12); this.env(g, t0, .003, .22, 1); o.connect(g); g.connect(this.master); o.start(t0); o.stop(t0 + .3); },
  hat(t0, v = .22, len = .04) { const s = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain(); s.buffer = this.noise; f.type = 'highpass'; f.frequency.value = 7000; this.env(g, t0, .001, len, v); s.connect(f); f.connect(g); g.connect(this.master); s.start(t0); s.stop(t0 + len + .02); },
  clap(t0) { const s = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain(); s.buffer = this.noise; f.type = 'bandpass'; f.frequency.value = 1800; f.Q.value = .8; this.env(g, t0, .002, .14, .6); s.connect(f); f.connect(g); g.connect(this.master); s.start(t0); s.stop(t0 + .2); },
  tone(t0, freq, dur, type, vol, wave) { const o = this.ctx.createOscillator(), g = this.ctx.createGain(); if (wave) o.setPeriodicWave(this.wave); else o.type = type; o.frequency.value = freq; this.env(g, t0, .004, dur, vol); o.connect(g); g.connect(this.master); o.start(t0); o.stop(t0 + dur + .05); },
  sched(animT) {
    if (!this.on || !this.ctx) return; const lookahead = .25, step16 = BEAT / 4, base = this.ctx.currentTime - animT;
    while (this.next * step16 < animT + lookahead) {
      const k = this.next++, at = base + k * step16 + .03; if (at < this.ctx.currentTime - .02) continue;
      const bar = Math.floor(k / 16) % 8, i16 = k % 16, chord = [[57, 60, 64], [53, 57, 60], [60, 64, 67], [55, 59, 62]][bar % 4], f = m => 440 * Math.pow(2, (m - 69) / 12);
      if (i16 % 4 === 0) this.kick(at); if (i16 % 8 === 4) this.clap(at); if (i16 % 2 === 0) this.hat(at, i16 % 4 === 2 ? .26 : .1, .035); if (i16 % 4 === 3 && k % 3 === 0) this.hat(at, .15, .06);
      if (i16 % 4 === 2 || i16 === 0 || i16 === 7 || i16 === 10) this.tone(at, f(chord[0] - 24 + (i16 === 7 ? 12 : 0)), .16, 'sawtooth', .22);
      const arp = [chord[0] + 12, chord[1] + 12, chord[2] + 12, chord[1] + 12][i16 % 4] + (bar >= 4 && i16 % 8 > 3 ? 12 : 0);
      this.tone(at, f(arp), .11, 'square', .09, true);
      if (i16 === 0 && bar % 2 === 0) this.tone(at, f(chord[2] + 24), .5, 'triangle', .1);
    }
  },
  toggle(on) { this.init(); if (!this.ctx) return; this.on = on; if (on) { this.ctx.resume(); this.next = Math.floor(S.t / (BEAT / 4)) + 1; } else this.ctx.suspend(); }
};

/* ============================================================================
   LOOP / UI
   ========================================================================== */
let running = true, last = 0, acc = 0, slow = 0, nfr = 0;
function frame(ts) {
  if (!last) last = ts; let dt = Math.min(.1, (ts - last) / 1000); last = ts;
  // адаптивное качество: если кадры тяжёлые — снижаем разрешение (только вниз)
  if (!PARAMS.has('q') && running && !document.hidden && ++nfr > 30) { slow = dt > .021 ? slow + 1 : Math.max(0, slow - 2); if (slow > 45 && Q > .75) { setQuality(Q > 1 ? 1 : .75); slow = 0; nfr = 0; } }
  if (running) { acc += dt; while (acc >= DT) { step(); acc -= DT; } Snd.sched(S.t); }
  render(); requestAnimationFrame(frame);
}
const $ = id => document.getElementById(id);
function setPause(p) { running = !p; $('bPause').textContent = p ? '▶ Играть' : '⏸ Пауза'; if (Snd.on && Snd.ctx) p ? Snd.ctx.suspend() : Snd.ctx.resume(); }
function setSound(on) { Snd.toggle(on); $('bSnd').classList.toggle('on', on); $('bSnd').textContent = on ? '🔊 Звук вкл' : '🔊 Звук'; }
$('bPause').onclick = () => setPause(running);
$('bSnd').onclick = () => setSound(!Snd.on);
$('bFs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); setPause(running); }
  else if (e.key === 'm' || e.key === 'M') setSound(!Snd.on);
  else if (e.key === 'f' || e.key === 'F') $('bFs').onclick();
});
function ptrPos(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; }
cv.addEventListener('pointermove', e => { const [x, y] = ptrPos(e); S.ptr.x = x; S.ptr.y = y; S.ptr.last = S.t; $('hint').style.opacity = 0; });
cv.addEventListener('pointerdown', e => { const [x, y] = ptrPos(e); S.ptr.x = x; S.ptr.y = y; S.ptr.last = S.t; burst(x * W, y * H, 16, ['red', 'pink', 'blue', 'yellow'], true); });
setTimeout(() => { $('hint').style.opacity = 0; }, 9000);

window.NEON = {
  LOOP, BEAT, reset, step, render,
  advanceTo(t) { while (S.t < t - 1e-6) step(); render(); },
  get time() { return S.t; }
};
setQuality(Q);
reset();
if (!PARAMS.has('manual')) requestAnimationFrame(frame);
})();
</script>
